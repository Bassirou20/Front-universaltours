<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Itinéo">
  <defs>
    <linearGradient id="itnBadge" x1="6" y1="4" x2="58" y2="60" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0A2A6B"/>
      <stop offset="0.55" stop-color="#13469E"/>
      <stop offset="1" stop-color="#1E63D8"/>
    </linearGradient>
    <linearGradient id="itnPin" x1="32" y1="14" x2="46" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFA24D"/>
      <stop offset="1" stop-color="#F07A1C"/>
    </linearGradient>
  </defs>

  <!-- Badge -->
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#itnBadge)"/>
  <!-- subtle top sheen -->
  <rect x="2" y="2" width="60" height="30" rx="18" fill="#FFFFFF" opacity="0.06"/>

  <!-- Journey path (dotted) from origin to destination -->
  <path d="M17 46 C 18 33, 31 45, 41 33"
        stroke="#FFFFFF" stroke-opacity="0.85" stroke-width="2.6"
        stroke-linecap="round" stroke-dasharray="0.2 6.2" fill="none"/>

  <!-- Origin dot -->
  <circle cx="17" cy="46" r="4.4" fill="#1E63D8" stroke="#FFFFFF" stroke-width="2.4"/>

  <!-- Destination map pin -->
  <path d="M41 16 C 34.4 16, 30 21, 30 27 C 30 34.5, 41 44, 41 44 C 41 44, 52 34.5, 52 27 C 52 21, 47.6 16, 41 16 Z" fill="url(#itnPin)"/>
  <circle cx="41" cy="27" r="4" fill="#FFFFFF"/>
</svg>
